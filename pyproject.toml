[project]
name = "extrator-de-imagens-botanicas"
version = "0.1.0"
description = "Extrai, identifica e inventaria imagens botânicas de PDFs e PPTXs"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"